<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BCC 医美处方</title>
    <link rel="icon" type="image/png" href="https://docs.bccsw.cn/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Courier+Prime:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Special+Elite&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
    <style>
      body {
        /* Wood texture background */
        background-color: #2d1b15; 
        background-image: url("https://www.transparenttextures.com/patterns/wood-pattern.png");
        overflow: hidden; /* Prevent scrolling on the desk */
        touch-action: none; /* Prevent bounce on mobile */
      }
      .font-typewriter {
        font-family: 'Courier Prime', monospace;
      }
      .font-vintage {
        font-family: 'Special Elite', cursive;
      }
      .font-elegant {
        font-family: 'Cinzel', serif;
      }
      .font-chinese {
        font-family: 'Noto Serif SC', serif;
      }
      .font-signature {
        font-family: 'Mrs Saint Delafield', cursive;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #a1887f;
        border-radius: 3px;
      }
      
      /* Metallic gradient for typewriter */
      .metal-gradient {
        background: linear-gradient(135deg, #4a4a4a 0%, #2b2b2b 50%, #1a1a1a 100%);
      }
      .key-shadow {
        box-shadow: 0 4px 0 #111, 0 5px 5px rgba(0,0,0,0.5);
      }
      .key-active {
        transform: translateY(4px);
        box-shadow: 0 0 0 #111, inset 0 2px 5px rgba(0,0,0,0.8);
      }

      /* Gentle Float Animation */
      @keyframes float-subtle {
        0%, 100% { transform: translateY(-3px); }
        50% { transform: translateY(0); }
      }
      .animate-float-subtle {
        animation: float-subtle 3s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "html2canvas": "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.esm.js",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
